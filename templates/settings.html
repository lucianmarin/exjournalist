{% extends "base.html" %}
{% block title %}Settings{% endblock %}

{% block content %}
<article class="card">
  <h2>Edit Profile</h2>
  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  <form method="post" action="/settings" class="form-grid">
    <label>Username
      <input type="text" name="username" maxlength="50" required value="{{ form.username if form else '' }}">
    </label>

    <label>Emoji
      <input type="text" name="emoji" maxlength="10" required value="{{ form.emoji if form else '' }}">
    </label>

    <label>Full name
      <input type="text" name="full_name" maxlength="120" required value="{{ form.full_name if form else '' }}">
    </label>

    <label>Description (Markdown)
      <textarea name="description_markdown" rows="8">{{ form.description_markdown if form else '' }}</textarea>
    </label>

    <label>New password
      <input type="password" name="password" minlength="8" autocomplete="new-password">
    </label>

    <label>Confirm new password
      <input type="password" name="password_confirm" minlength="8" autocomplete="new-password">
    </label>

    <button type="submit">Save Changes</button>
  </form>
</article>
{% endblock %}
