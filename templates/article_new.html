{% extends "base.html" %}
{% block title %}New Article{% endblock %}

{% block content %}
<article class="card">
  <h2>Create Article</h2>

  <form method="post" action="/articles/new" class="form-grid">
    <p class="hint">Writing as {{ current_user.emoji }} @{{ current_user.username }}</p>

    <label>Title
      <input type="text" name="title" required maxlength="255">
    </label>

    <label>Category
      <input type="text" name="category_name" placeholder="tech" required>
    </label>

    <label>Content (Markdown)
      <textarea name="content_markdown" rows="14" required></textarea>
    </label>

    <button type="submit">Publish</button>
  </form>
</article>
{% endblock %}
