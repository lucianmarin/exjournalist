server {
    listen 443 ssl http2;
    server_name exjournalist.com;
    access_log /home/lucian/logs/exj.log.gz combined gzip;
    ssl_certificate /etc/letsencrypt/live/exjournalist.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exjournalist.com/privkey.pem;
    location /static {
        root /home/lucian/exjournalist;
        expires 365d;
        autoindex off;
    }
    location /.well-known/acme-challenge {
        root /home/lucian;
    }
    location / {
        proxy_pass http://unix:/home/lucian/exjournalist/exj.socket;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name exjournalist.com;
    return 301 https://exjournalist.com$request_uri;
}

